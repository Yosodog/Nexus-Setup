name: Setup CI

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: '1.22.x'
      - name: Verify shell contract
        run: |
          bash -n bootstrap.sh install_nexus.sh tests/bootstrap_contract_test.sh
          bash tests/bootstrap_contract_test.sh
      - name: Test updater
        run: go test ./...
      - name: Build Linux CLI
        run: CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -o /tmp/nexus-linux-amd64 ./cmd/nexus
