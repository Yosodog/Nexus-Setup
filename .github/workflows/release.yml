name: Publish Nexus CLI release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: '1.22.x'
      - name: Validate tag
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: '[[ "${RELEASE_TAG}" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z]+(\.[0-9A-Za-z]+)*)?$ ]]'
      - name: Test
        run: |
          bash tests/bootstrap_contract_test.sh
          go test ./...
      - name: Build static CLI
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          mkdir -p dist
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath \
            -ldflags "-s -w -X github.com/Yosodog/Nexus-Setup/internal/updater.BuildVersion=${RELEASE_TAG}" \
            -o dist/nexus-linux-amd64 ./cmd/nexus
          (cd dist && sha256sum nexus-linux-amd64 > nexus-linux-amd64.sha256)
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          prerelease=()
          [[ "${RELEASE_TAG}" == *-* ]] && prerelease=(--prerelease)
          gh release create "${RELEASE_TAG}" dist/nexus-linux-amd64 dist/nexus-linux-amd64.sha256 \
            --verify-tag --generate-notes --title "Nexus CLI ${RELEASE_TAG}" "${prerelease[@]}"
